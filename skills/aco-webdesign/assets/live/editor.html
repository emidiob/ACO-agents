<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACO Live Editor</title><style>body{margin:0;font:15px system-ui;color:#20252b;background:#f3f4f5}header{padding:16px;border-bottom:1px solid #aaa;display:flex;gap:12px;align-items:center;flex-wrap:wrap}main{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 75px)}aside{padding:18px;overflow:auto}label{display:block;margin:16px 0 6px}input,select,textarea,button{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}textarea,input{width:100%}iframe{border:0;background:white;width:100%;height:100%}button{cursor:pointer}#status{min-height:3em}h1{font-size:20px;margin:0}small{display:block;margin:12px 0}*:focus-visible{outline:3px solid #3761ca;outline-offset:2px}@media(max-width:700px){main{grid-template-columns:220px 1fr}}</style><header><h1>ACO Live</h1><label for="file">Page</label><select id="file"></select><button id="reload">Reload</button><button id="undo">Undo</button><button id="redo">Redo</button></header><main><aside><p>Select an element in the preview.</p><p id="selected">No selection</p><label for="copy">Text</label><textarea id="copy" rows="4"></textarea><button id="save-text">Save text</button><label for="property">CSS property</label><select id="property"><option>color</option><option>background-color</option><option>font-size</option><option>font-weight</option><option>line-height</option><option>letter-spacing</option><option>padding</option><option>margin</option><option>border-radius</option><option>max-width</option><option>gap</option><option>text-align</option></select><label for="value">Value</label><input id="value" value="#315c48"><button id="save-style">Save style</button><p id="status" role="status" aria-live="polite"></p><small>Saves edit the HTML source. Undo/redo lasts for this server session. Static HTML only; use the source editor for nested markup and application components.</small></aside><iframe id="preview" title="Editable page preview"></iframe></main><script>window.acoToken="ACO_SESSION_TOKEN";</script><script src="/__aco/editor.js"></script></html>
